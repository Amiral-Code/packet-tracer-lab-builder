The recovery sequence matters more than any individual command. Access-layer state
creates the connected networks; connected networks enable the routing control plane;
routing delivers service traffic to policy; policy decides whether translation is ever
reached. The six faults were deliberately placed at different points in that chain.

The Physical workspace is a staging representation, not an assessed cabling exercise.
Use it to connect a logical device to its rack or desk location, but use the logical
workspace and verification commands as the source of grading evidence.
"""
