[lab]
id = "northstar-enterprise-recovery"
title = "Northstar Cutover: Enterprise Recovery Capstone"
level = 4
kind = "mixed"
exam = "CCNA capstone / ENCOR foundations"
time = 90
labels = true
scenario = """
Northstar Logistics is completing a weekend network cutover. The new campus core,
branch edge, access layer, and public-services segment have been cabled in a staging
facility. Most of the intended configuration is present, but several deployment tasks
were left unfinished and six independent faults were introduced during handover.

Act as the escalation engineer. Complete the documented baseline, recover the failed
services from symptoms rather than a fault list, and prove that segmentation, dynamic
routing, address assignment, IPv6, security policy, and edge translation all agree.
The Physical workspace represents the staging rack and desks; grading is based on the
logical configuration, not rack position.
"""
objectives = [
  "Complete VLAN, trunk, LACP EtherChannel, Rapid PVST, and access-port security configuration",
  "Restore Layer 3 SVIs, inter-VLAN routing, DHCP relay, and static endpoint addressing",
  "Recover multi-area OSPF across the campus, backbone, and branch",
  "Verify dual-stack interface addressing and IPv6 static routing",
  "Enforce an extended ACL and restore PAT toward the public-services segment",
  "Diagnose six hidden faults using a structured evidence-first workflow",
]

[activity]
timer = "countdown"
countdown_minutes = 90
answer_convergence_ms = 30000
profile_locked = false
locking_preset = "cli-only"
incomplete_feedback = "The cutover is not stable yet. Review each failed item and capture the related `show` evidence before changing configuration."
complete_feedback = "All assessed Northstar outcomes pass. **Save the activity** and keep your before/after evidence with the change record."

