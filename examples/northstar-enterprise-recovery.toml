[[fault]]
device = "HQ-SW1"
apply = """
interface Port-channel1
 switchport trunk allowed vlan 10,20
"""
symptom = "VLANs 30 and 99 disappear when traffic uses the HQ-SW1 uplink."
explain = "Port-channel1 allowed only VLANs 10 and 20. Restore the intended 10,20,30,99 allowed list on the logical port-channel."

[[fault]]
device = "HQ-SW2"
find = "spanning-tree vlan 20 priority 28672"
replace = "spanning-tree vlan 20 priority 61440"
symptom = "The operations VLAN elects an unexpected secondary root after a topology change."
explain = "HQ-SW2 had an inferior VLAN 20 bridge priority. Restore priority 28672."

[[fault]]
device = "CORE1"
find = " ip helper-address 10.255.0.1"
replace = " ip helper-address 10.255.0.9"
symptom = "HQ-USER1 cannot obtain a DHCP lease after its access port is restored."
explain = "Vlan10 relayed DHCP to a nonexistent address. Point the helper to HQ-EDGE at 10.255.0.1."

[[fault]]
device = "HQ-EDGE"
apply = """
no ip nat inside source list NAT_INSIDE interface GigabitEthernet0/0/2 overload
"""
symptom = "Inside-to-public tests create no translation entries on HQ-EDGE."
explain = "The PAT rule was missing. Restore overload using NAT_INSIDE and G0/0/2."

[[fault]]
device = "BR-R1"
find = " network 10.255.255.0 0.0.0.3 area 0"
replace = " network 10.255.255.0 0.0.0.3 area 20"
symptom = "BR-R1 never forms an IPv4 OSPF adjacency with HQ-EDGE."
explain = "The WAN was placed in OSPF area 20 on BR-R1 while HQ-EDGE uses area 0. Restore area 0."

[[fault]]
device = "HQ-OPS1"
pc = { dhcp = false, ip = "10.10.20.20", mask = "255.255.255.0", gw = "10.10.10.1" }
symptom = "HQ-OPS1 reaches local VLAN peers but not routed destinations."
explain = "The workstation had the user-VLAN gateway. Set its gateway to 10.10.20.1."

[[part]]
title = "Build an evidence map"
intro = "Do not change configuration yet. Establish what is physically present, what is administratively down, and which symptoms share a likely dependency."
steps = [
  "Inspect both **Logical** and **Physical** workspaces. Record the rack devices, access endpoints, redundant HQ uplinks, and the router-on-a-stick branch link.",
  "On every infrastructure device, capture `show ip interface brief`, `show vlan brief`, `show interfaces trunk`, and `show cdp neighbors` where supported.",
  "On CORE1 and both routers, capture the routing table and OSPF neighbor state. Treat missing adjacency, missing connected routes, and missing learned routes as separate observations.",
  "Create a short dependency order: access port, VLAN/trunk, gateway, routing, policy, then translation. Work from the bottom of that list upward.",
]
hint = "A failed end-to-end ping is a symptom, not a diagnosis. First prove the source host can reach its own gateway."
why = "A disciplined baseline prevents one early configuration change from hiding a second independent fault."

[[part]]
title = "Complete the campus Layer 3 baseline"
intro = "CORE1 and its routed transit were intentionally left incomplete. Restore the documented addressing before chasing dynamic-routing symptoms."
steps = [
  "Enable IPv4 and IPv6 routing on **CORE1**.",
  "Configure and enable CORE1 G0/1 and HQ-EDGE G0/0/1 using the addressing table. Add the listed IPv6 addresses `2001:DB8:0:1::2/64` and `2001:DB8:0:1::1/64`.",
  "Configure and enable CORE1 SVIs for VLANs 10, 20, 30, and 99. Add `2001:DB8:10::1/64` to Vlan10.",
  "Verify connected routes and ping 10.255.0.1 from CORE1 using G0/1 as the source.",
]
hint = "A multilayer switch needs `ip routing`; an addressed SVI also needs its VLAN active on at least one forwarding port."
why = "The transit and SVIs are the foundation for DHCP relay, OSPF advertisements, ACL enforcement, and inter-VLAN forwarding."

[[part]]
title = "Recover the HQ access layer"
intro = "Complete the user/server access ports, then verify the two LACP uplinks and Rapid PVST design."
steps = [
  "Restore HQ-SW1 Fa0/1 as a secure VLAN 10 access port. Restore HQ-SW2 Fa0/1 in VLAN 20 and Fa0/2 in VLAN 30; enable the ports.",
  "Verify Port-channel1 and Port-channel2 with `show etherchannel summary`. Every member should be bundled under LACP, not merely connected.",
  "Compare the allowed VLAN lists on both ends of each port-channel and on the inter-access-switch trunk.",
  "Use `show spanning-tree vlan 10`, `20`, and `30` to confirm the intended root and secondary-root behavior under Rapid PVST.",
]
hint = "Apply trunk policy to the Port-channel interface; member links inherit the logical bundle's forwarding policy."
why = "EtherChannel removes per-link STP blocking inside a bundle, while Rapid PVST still protects the redundant switch triangle."

[[part]]
title = "Complete the branch access layer"
intro = "The branch uses router-on-a-stick: the switch trunk carries VLANs 40, 50, and 99 to BR-R1 subinterfaces."
steps = [
  "Restore BR-SW1 Fa0/1 as a secure VLAN 40 user port and Fa0/2 as a VLAN 50 server port; enable both.",
  "Verify G0/1 is an 802.1Q trunk allowing VLANs 40, 50, and 99.",
  "Confirm BR-R1 G0/1 is enabled and that its .40, .50, and .99 subinterfaces use the expected encapsulation and gateways.",
  "Set **BR-PC1** to DHCP and assign **BR-SRV1** its static address and gateway from the table.",
]
hint = "The parent router interface carries no IPv4 address, but it must be up for every subinterface to operate."
why = "Router-on-a-stick is a compact branch design that makes VLAN tags and gateway subinterfaces directly visible."

[[part]]
title = "Restore services and endpoint addressing"
intro = "Address the static servers, then follow the DHCP request path from each client to HQ-EDGE and back."
steps = [
  "Set **HQ-USER1** to DHCP. Configure HQ-SRV1 and PUBLIC-SRV with the static values in the addressing table.",
  "On CORE1, verify the VLAN 10 helper address. On BR-R1, verify the helper under G0/1.40.",
  "Inspect the HQ-EDGE DHCP pools and exclusions. Renew both DHCP clients and confirm each receives an address from its local subnet.",
  "Correct HQ-OPS1 so that its default gateway belongs to the operations VLAN.",
]
hint = "The relay inserts the gateway-interface address so the DHCP server can select the correct pool."
why = "DHCP across routed boundaries depends on correct access VLANs, active gateways, routing, relay, and server pools at the same time."

[[part]]
title = "Recover OSPF and IPv6 reachability"
intro = "IPv4 uses multi-area OSPF; IPv6 uses the documented static next hops. Validate each control plane independently."
steps = [
  "Restore the OSPF adjacency between HQ-EDGE and BR-R1. The WAN belongs to area 0 on both ends.",
  "Confirm CORE1 advertises campus networks in area 10 and BR-R1 advertises branch networks in area 20 while access interfaces remain passive.",
  "Verify HQ-EDGE learns 10.10.0.0/16 subnets through CORE1 and 172.16.0.0/16 subnets through BR-R1 as specific OSPF routes.",
  "Verify the IPv6 addresses and static routes, then ping the opposite router's WAN IPv6 address and the remote user-prefix gateway.",
]
hint = "OSPF neighbors must agree on area, timers, network type, authentication, and subnet. Start with area and interface state here."
why = "Separating IPv4 OSPF evidence from IPv6 static-routing evidence makes dual-stack failures much easier to isolate."

[[part]]
title = "Validate policy and PAT"
intro = "Finish with policy: users may reach approved services, the operations VLAN is isolated from users, and inside addresses are translated toward public services."
steps = [
  "Review the USERS-IN ACL on CORE1 and confirm it is applied inbound on Vlan10. Explain the first-match behavior for DNS, HTTP, server access, operations isolation, and the final permit.",
  "Verify NAT inside/outside roles on HQ-EDGE and restore the missing PAT overload statement if needed.",
  "Generate traffic from an inside host toward PUBLIC-SRV and inspect `show ip nat translations` and `show ip nat statistics`.",
  "Prove that the user VLAN cannot initiate traffic toward the operations VLAN while approved destinations remain reachable.",
]
hint = "A correct ACL does not create translations; a correct NAT rule does not override a denied packet. Check policy before translation counters."
why = "Security policy and address translation are separate forwarding stages and should be verified separately."

[[part]]
title = "Close the six incident tickets"
intro = "Perform a final sweep without consulting the answer guide. Each ticket should have evidence, a minimal correction, and a post-change verification."
steps = [
  "Confirm all required VLANs cross the HQ-SW1 port-channel.",
  "Confirm HQ-SW2 has the intended VLAN 20 spanning-tree priority.",
  "Confirm the HQ user DHCP relay targets a real address.",
  "Confirm HQ-EDGE has an active PAT overload rule.",
  "Confirm the branch WAN participates in the correct OSPF area.",
  "Confirm HQ-OPS1 uses its own VLAN's gateway.",
]
hint = "For each ticket, save one before/after command output. A passing ping alone is not enough evidence for EtherChannel, STP, DHCP relay, OSPF area, ACL, or NAT correctness."
why = "Operational handover requires reproducible evidence, not only a network that happens to pass one test."

