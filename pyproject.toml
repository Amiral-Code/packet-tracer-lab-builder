[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pt-lab-builder"
version = "0.3.0"
description = "Build original native Cisco Packet Tracer activities from TOML specifications"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Amiral"}]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Amiral-Code/packet-tracer-lab-builder"
Repository = "https://github.com/Amiral-Code/packet-tracer-lab-builder.git"
Issues = "https://github.com/Amiral-Code/packet-tracer-lab-builder/issues"

[project.scripts]
ptlab = "pt_lab_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pt_lab_builder"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "pt_lab_builder/recipes"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "examples", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "CMakeLists.txt", "pyproject.toml"]
